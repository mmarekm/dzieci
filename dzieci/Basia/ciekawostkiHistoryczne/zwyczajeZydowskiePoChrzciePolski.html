        Żydzi po Chrzcie Polski
    </div>
	<p>
		Po zakazie handlu niewolnikami na ziemiach polskich żydowscy kupcy skierowali swoją działalność ku innemu zajęciu potępianemu przez chrześcijaństwo — lichwie. Ślady tego zjawiska można dostrzec w źródłach sięgających czasów Mieszka III Starego.
	</p>
